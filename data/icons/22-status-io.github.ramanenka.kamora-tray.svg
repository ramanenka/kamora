<?xml version="1.0" encoding="UTF-8"?>
<!--
    Kamora Backup tray icon, drawn for 22px, the size a panel at 100% scaling asks for.

    The drive silhouette is the one Breeze draws for drive-harddisk at
    22px, (C) KDE Visual Design Group, LGPL-3.0-or-later, with the
    backup arrow turning inside its body the way drive-harddisk-encrypted
    carries its padlock.

    The plain glyph: nothing needs looking at.

    The glyph sits in a 16x16 box inside the 22 grid and the badge is a
    3-radius disc at 16,16 with a 1px gap around it, which is what the
    Breeze status icons do, so Kamora carries the same weight as its
    neighbours in the tray.
-->
<svg viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">
    <style type="text/css" id="current-color-scheme">
        .ColorScheme-Text {
            color:#232629;
        }
    </style>
    <g fill="currentColor" class="ColorScheme-Text">
        <path d="m5 3v16h12v-16zm4 1h4a3 3 0 0 1 3 3v2.088a1.5 1.5 0 0 0 -1 1.412 1.5 1.5 0 0 0 1 1.412v2.088l-2 2h-6l-2-2v-2.088a1.5 1.5 0 0 0 1-1.412 1.5 1.5 0 0 0 -1-1.412v-2.088a3 3 0 0 1 3-3zm-2 13h4v1h-4zm6 0h2v1h-2z"/>
        <path d="M 10.145 11.849 A 2.5 2.5 0 1 0 8.500 9.500" fill="none" stroke="currentColor" stroke-width="0.9"/>
        <path d="M 7.350 9.500 L 9.650 9.500 L 8.500 11.800 Z"/>
    </g>
</svg>
